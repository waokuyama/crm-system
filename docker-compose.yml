services:

  web:
    image: nginx:latest
    container_name: crm-web

    ports:
      - "8080:80"

    volumes:
      - ./src:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf

    depends_on:
      - app

  app:
    build:
      context: ./php

    container_name: crm-app

    volumes:
      - ./src:/var/www/html

  db:
    image: mysql:8.0

    container_name: crm-db

    ports:
      - "3306:3306"

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: crm

    volumes:
      - mysql_data:/var/lib/mysql

  node:
    image: node:22

    container_name: crm-node

    working_dir: /var/www/html

    volumes:
      - ./src:/var/www/html

    tty: true

  redis:
    image: redis:7-alpine
    container_name: crm-redis
    restart: unless-stopped

    ports:
      - "6379:6379"

volumes:
  mysql_data:
